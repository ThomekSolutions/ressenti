<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="Journal personnel de symptômes, à compléter le soir sur votre téléphone.">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'">
  <title>Ressenti</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#journee">
        <img src="./icon-192.png" alt="" width="38" height="38">
        <span>Ressenti</span>
      </a>
      <a href="#reglages" class="icon-button settings-link" aria-label="Réglages" title="Réglages"><i class="icon sliders" aria-hidden="true"></i></a>
    </div>
  </header>
  <main id="main" tabindex="-1"><p class="muted" role="status">Ouverture du journal…</p></main>
  <nav class="bottom" aria-label="Navigation principale">
    <div class="bottom-inner">
      <a href="#journee"><i class="icon day-icon" aria-hidden="true"></i>Journée</a>
      <a href="#historique"><i class="icon calendar-icon" aria-hidden="true"></i>Historique</a>
      <a href="#rapport"><i class="icon report-icon" aria-hidden="true"></i>Rapport</a>
    </div>
  </nav>
  <div class="toast" id="message" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <noscript>Activez JavaScript pour utiliser le journal.</noscript>
</body>
</html>
